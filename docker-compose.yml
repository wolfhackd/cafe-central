services:
  postgres:
    image: postgres:17-alpine
    container_name: cafe-central
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=CafeCentral
    ports:
      - "5432:5432"
    volumes:
      - db-service-data:/var/lib/postgres



volumes:
  db-service-data: